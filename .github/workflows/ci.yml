name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node:
          - 22.22.0
          - 24.x

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks
        run: pnpm run check

      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'EOF'
          import manifest from './package.json' with { type: 'json' }
          if (manifest.version !== process.env.RELEASE_TAG) {
            throw new Error(`tag ${process.env.RELEASE_TAG} does not match package version ${manifest.version}`)
          }
          EOF

      - name: Audit npm tarball
        if: matrix.node == '22.22.0'
        run: |
          mkdir -p "$RUNNER_TEMP/dsh-codex-pack"
          pnpm pack --pack-destination "$RUNNER_TEMP/dsh-codex-pack"
          archive="$(find "$RUNNER_TEMP/dsh-codex-pack" -name '*.tgz' -print -quit)"
          test -n "$archive"
          tar -tzf "$archive" | sort | tee "$RUNNER_TEMP/dsh-codex-pack/files.txt"
          grep -Fx 'package/lib/index.js' "$RUNNER_TEMP/dsh-codex-pack/files.txt"
          grep -Fx 'package/lib/client.cjs' "$RUNNER_TEMP/dsh-codex-pack/files.txt"
          grep -Fx 'package/lib/types/index.d.ts' "$RUNNER_TEMP/dsh-codex-pack/files.txt"
          grep -Fx 'package/docs/images/openai-codex-settings.svg' "$RUNNER_TEMP/dsh-codex-pack/files.txt"
          if grep -Fx 'package/lib/client.js' "$RUNNER_TEMP/dsh-codex-pack/files.txt"; then
            echo 'unexpected ESM-ambiguous client.js in package' >&2
            exit 1
          fi
